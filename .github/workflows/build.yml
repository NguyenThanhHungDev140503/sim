name: Build & Push GHCR

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push-app:
    name: Build & Push sim-app
    runs-on: [self-hosted, ubuntu-24.04, docker]
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase repository owner
        id: repo-owner
        run: |
          echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Free disk space & Enable Swap
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          if ! swapon --show | grep -q "/swapfile"; then
            sudo swapoff -a || true
            sudo rm -f /swapfile
            sudo fallocate -l 10G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=10240
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile
          fi
          free -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config: .github/buildkitd.toml
          driver: docker-container
          driver-opts: |
            network=host
            memory=6g
            memswap=8g

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/sim-app
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short

      - name: Build Docker image with resource limits
        run: |
          TAG_LATEST="${{ env.REGISTRY }}/${{ env.OWNER_LC }}/sim-app:latest"
          TAG_SHA="${{ env.REGISTRY }}/${{ env.OWNER_LC }}/sim-app:${GITHUB_SHA::7}"
          docker buildx build \
            --builder default \
            --progress=plain \
            -f docker/app.Dockerfile \
            -t "$TAG_LATEST" \
            -t "$TAG_SHA" \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --load \
            .

      - name: Push Docker image to GHCR
        if: github.event_name != 'pull_request'
        run: |
          TAG_LATEST="${{ env.REGISTRY }}/${{ env.OWNER_LC }}/sim-app:latest"
          TAG_SHA="${{ env.REGISTRY }}/${{ env.OWNER_LC }}/sim-app:${GITHUB_SHA::7}"
          docker push "$TAG_LATEST"
          docker push "$TAG_SHA"

  build-and-push-other:
    name: Build & Push other services
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - service: sim-realtime
            dockerfile: docker/realtime.Dockerfile
          - service: sim-migrations
            dockerfile: docker/db.Dockerfile
          - service: sim-cron
            dockerfile: docker/cron.Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase repository owner
        id: repo-owner
        run: |
          echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Free disk space & Enable Swap
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          if ! swapon --show | grep -q "/swapfile"; then
            sudo swapoff -a || true
            sudo rm -f /swapfile
            sudo fallocate -l 10G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=10240
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile
          fi
          free -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/${{ matrix.service }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short

      - name: Build and push Docker image
        run: |
          TAG_LATEST="${{ env.REGISTRY }}/${{ env.OWNER_LC }}/${{ matrix.service }}:latest"
          TAG_SHA="${{ env.REGISTRY }}/${{ env.OWNER_LC }}/${{ matrix.service }}:${GITHUB_SHA::7}"
          docker buildx build \
            --builder default \
            --progress=plain \
            -f ${{ matrix.dockerfile }} \
            -t "$TAG_LATEST" \
            -t "$TAG_SHA" \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --load \
            .
        if: github.event_name != 'pull_request'