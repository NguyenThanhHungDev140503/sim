# BuildKit configuration for GitHub hosted runners (7GB RAM)
# Limits parallelism and configures aggressive garbage collection to prevent OOM

[worker.oci]
  max-parallelism = 1
  snapshotter = "overlayfs"
  gc = true
  gckeepstorage = "1GB"

  # Remove cache older than 24h if over 1GB
  [[worker.oci.gcpolicy]]
    keepBytes = "1GB"
    keepDuration = "24h"
    filters = ["type==source.local", "type==exec.cachemount", "type==source.git.checkout"]

  # Hard limit at 2GB total
  [[worker.oci.gcpolicy]]
    keepBytes = "2GB"
    all = true