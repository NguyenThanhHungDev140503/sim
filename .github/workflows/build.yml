name: Build & Push GHCR

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  # pull_request: []  # Disabled to save CI minutes

env:
  REGISTRY: ghcr.io

jobs:
  build-nextjs:
    name: Build Next.js app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      nextjs-output-path: ${{ steps.build.outputs.nextjs-output-path }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: |
          cd apps/sim
          bun install --frozen-lockfile

      - name: Build Next.js app
        id: build
        env:
          CI: true
          AGGRESSIVE_CI: true
          USE_WEBPACK: true
          LIMIT_WEBPACK_WORKERS: true
          MINIMAL_CI: true
          NODE_OPTIONS: --max-old-space-size=5632
          NEXT_TELEMETRY_DISABLED: 1
          VERCEL_TELEMETRY_DISABLED: 1
          DATABASE_URL: "postgresql://user:pass@localhost:5432/dummy"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
          BETTER_AUTH_SECRET: "build-time-dummy-secret-change-in-production"
        run: |
          cd apps/sim
          bun run next build
          echo "nextjs-output-path=apps/sim/.next/standalone" >> $GITHUB_OUTPUT

      - name: Upload Next.js build output
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build-output
          path: apps/sim/.next/standalone
          retention-days: 1

  build-and-push-app:
    name: Build & Push sim-app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    needs: build-nextjs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Next.js build output
        uses: actions/download-artifact@v4
        with:
          name: nextjs-build-output
          path: apps/sim/.next/standalone

      - name: Set lowercase repository owner
        id: repo-owner
        run: |
          echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/sim-app
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/app.Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: false

  build-and-push-other:
    name: Build & Push other services
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - service: sim-realtime
            dockerfile: docker/realtime.Dockerfile
          - service: sim-migrations
            dockerfile: docker/db.Dockerfile
          - service: sim-cron
            dockerfile: docker/cron.Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase repository owner
        id: repo-owner
        run: |
          echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/${{ matrix.service }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: false