name: Build & Push GHCR

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  # pull_request: []  # Disabled to save CI minutes

concurrency:
  group: build-ghcr-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push-app:
    name: Build & Push sim-app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure 10GB Swap on Runner Host
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 10G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=10240
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Set lowercase repository owner
        id: repo-owner
        run: |
          echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Start Docker build telemetry
        shell: bash
        run: |
          TELEMETRY_DIR="${RUNNER_TEMP}/sim-build-telemetry"
          mkdir -p "$TELEMETRY_DIR"
          TELEMETRY_LOG="$TELEMETRY_DIR/docker-memory.log"

          (
            while true; do
              echo "--- [TELEMETRY] $(date -u +'%Y-%m-%dT%H:%M:%SZ') ---" | tee -a "$TELEMETRY_LOG"
              free -m | tee -a "$TELEMETRY_LOG"
              if [ -f /sys/fs/cgroup/memory.current ]; then
                echo "cgroup memory.current: $(cat /sys/fs/cgroup/memory.current) bytes" | tee -a "$TELEMETRY_LOG"
              fi
              docker stats --no-stream --format '{{.Name}} {{.MemUsage}} {{.MemPerc}} {{.CPUPerc}}' | tee -a "$TELEMETRY_LOG" || true
              echo '' | tee -a "$TELEMETRY_LOG"
              sleep 5
            done
          ) &

          echo "$!" > "$TELEMETRY_DIR/sampler.pid"
          echo "BUILD_TELEMETRY_DIR=$TELEMETRY_DIR" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/sim-app
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/app.Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: false

      - name: Stop Docker build telemetry
        if: always()
        shell: bash
        run: |
          if [ -f "$BUILD_TELEMETRY_DIR/sampler.pid" ]; then
            kill "$(cat "$BUILD_TELEMETRY_DIR/sampler.pid")" 2>/dev/null || true
          fi

      - name: Upload Docker build telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sim-app-docker-memory-telemetry
          path: ${{ runner.temp }}/sim-build-telemetry/
          if-no-files-found: ignore

  build-and-push-other:
    name: Build & Push other services
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - service: sim-realtime
            dockerfile: docker/realtime.Dockerfile
          - service: sim-migrations
            dockerfile: docker/db.Dockerfile
          - service: sim-cron
            dockerfile: docker/cron.Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase repository owner
        id: repo-owner
        run: |
          echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/${{ matrix.service }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: false
